                    "on-secondary-fixed-variant": "#464747",
                    "error-container": "#93000a",

                    "tertiary": "#ffffff",

<style>
        body {
            background-color: #000000;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .login-card {
            background-color: #000000;
        }
        input::placeholder {
            color: #444748;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
<main class="w-full max-w-[400px] px-margin-mobile md:px-0">
<!-- Logo Section -->
<div class="mb-12 text-center">
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tighter">
                HaberBot
            </h1>
</div>
<!-- Login Form -->
<section class="space-y-6">
<div class="space-y-4">
<div class="relative group">
<label class="sr-only" for="password">Password</label>
<input class="w-full bg-background border border-outline-variant text-on-surface px-4 py-3 rounded focus:outline-none focus:border-primary transition-colors duration-150 font-label-md text-label-md" id="password" name="password" placeholder="Admin Şifresi" required="" type="password"/>
</div>
<button class="w-full bg-primary text-on-primary font-body-md text-body-md py-3 rounded-lg font-bold hover:opacity-90 active:scale-[0.98] transition-all duration-150" type="submit">
                    Giriş Yap
                </button>
</div>
<!-- Additional Help / Feedback (Minimalist) -->
<div class="flex justify-center">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors duration-150" href="#">
                    Şifremi unuttum
                </a>
</div>
</section>
<!-- Aesthetic Footer Component Integration (Minimalist Version) -->
<footer class="mt-24 text-center">
<p class="font-label-sm text-label-sm text-on-surface-variant opacity-40">
                © 2024 HaberBot AI. All rights reserved.
            </p>
</footer>
</main>
<!-- Visual Polish: Subtle Background Noise/Grain -->
<div class="fixed inset-0 pointer-events-none opacity-[0.03] bg-[url('https://www.transparenttextures.com/patterns/stardust.png')] z-50"></div>
<script>
        // Micro-interaction for the input field to create a "focus" feel on the entire container if needed
        const passwordInput = document.getElementById('password');
        
        passwordInput.addEventListener('focus', () => {
            // Potential for atmospheric UI changes on focus
        });

        // Simple form submission mock logic
        document.querySelector('button').addEventListener('click', (e) => {
            const btn = e.currentTarget;
            if(passwordInput.value.trim() !== "") {
                btn.innerHTML = '<span class="flex items-center justify-center gap-2">Doğrulanıyor...</span>';
                btn.classList.add('opacity-80');
                setTimeout(() => {
                    btn.innerHTML = 'Giriş Yap';
                    btn.classList.remove('opacity-80');
                }, 1000);
            }
        });
    </script>
</body></html>
